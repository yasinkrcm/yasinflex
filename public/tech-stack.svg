<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="630" viewBox="0 0 1160 630" font-family="'Segoe UI','Inter',Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0b0f"/>
      <stop offset="1" stop-color="#141419"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e50914"/>
      <stop offset="1" stop-color="#b1060f"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e50914" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#e50914" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1160" height="630" fill="url(#bg)"/>
  <ellipse cx="1050" cy="40" rx="420" ry="180" fill="url(#glow)"/>

  <!-- Header -->
  <rect x="48" y="42" width="14" height="42" rx="3" fill="url(#accent)"/>
  <text x="74" y="74" fill="#ffffff" font-size="30" font-weight="800" letter-spacing="0.5">YASINFLEX</text>
  <text x="74" y="97" fill="#8b93a1" font-size="13.5" font-weight="500" letter-spacing="4">TECH STACK</text>
  <text x="1112" y="88" fill="#4d5563" font-size="13" text-anchor="end" font-weight="600">Powered by TMDB</text>

  <!-- Column: Frontend -->
  <g filter="url(#shadow)">
    <rect x="48" y="126" width="344" height="458" rx="16" fill="#1a1a21" stroke="#2a2a33" stroke-width="1.5"/>
  </g>
  <rect x="48" y="126" width="344" height="54" rx="16" fill="#22222b"/>
  <rect x="48" y="164" width="344" height="16" fill="#22222b"/>
  <circle cx="82" cy="153" r="6" fill="#38bdf8"/>
  <text x="102" y="159" fill="#ffffff" font-size="16" font-weight="700" letter-spacing="1.2">FRONTEND</text>

  <g font-size="15">
    <text x="82" y="231" fill="#e8eaf0" font-weight="700">Next.js 16</text>
    <text x="82" y="250" fill="#8b93a1" font-size="12">App Router · Turbopack · RSC</text>

    <text x="82" y="299" fill="#e8eaf0" font-weight="700">React 19</text>
    <text x="82" y="318" fill="#8b93a1" font-size="12">Server Components · Context API</text>

    <text x="82" y="367" fill="#e8eaf0" font-weight="700">TypeScript 5</text>
    <text x="82" y="386" fill="#8b93a1" font-size="12">Strict mode · End-to-end types</text>

    <text x="82" y="435" fill="#e8eaf0" font-weight="700">Tailwind CSS 4</text>
    <text x="82" y="454" fill="#8b93a1" font-size="12">Utility-first · PostCSS pipeline</text>

    <text x="82" y="503" fill="#e8eaf0" font-weight="700">Responsive UI Kit</text>
    <text x="82" y="522" fill="#8b93a1" font-size="12">Hero slider · Kalıcı satırlar · Modal</text>
  </g>

  <!-- Column: Backend -->
  <g filter="url(#shadow)">
    <rect x="408" y="126" width="344" height="458" rx="16" fill="#1a1a21" stroke="#2a2a33" stroke-width="1.5"/>
  </g>
  <rect x="408" y="126" width="344" height="54" rx="16" fill="#22222b"/>
  <rect x="408" y="164" width="344" height="16" fill="#22222b"/>
  <circle cx="442" cy="153" r="6" fill="#22c55e"/>
  <text x="462" y="159" fill="#ffffff" font-size="16" font-weight="700" letter-spacing="1.2">BACKEND &amp; AUTH</text>

  <g font-size="15">
    <text x="442" y="231" fill="#e8eaf0" font-weight="700">Next.js API Routes</text>
    <text x="442" y="250" fill="#8b93a1" font-size="12">Node.js runtime · REST uçları</text>

    <text x="442" y="299" fill="#e8eaf0" font-weight="700">JWT (jsonwebtoken)</text>
    <text x="442" y="318" fill="#8b93a1" font-size="12">HttpOnly çerez · 7 gün oturum</text>

    <text x="442" y="367" fill="#e8eaf0" font-weight="700">bcryptjs</text>
    <text x="442" y="386" fill="#8b93a1" font-size="12">12 tur hash · Pre-save middleware</text>

    <text x="442" y="435" fill="#e8eaf0" font-weight="700">Rate Limiting</text>
    <text x="442" y="454" fill="#8b93a1" font-size="12">IP tabanlı · Brute-force koruması</text>

    <text x="442" y="503" fill="#e8eaf0" font-weight="700">Security Headers</text>
    <text x="442" y="522" fill="#8b93a1" font-size="12">CSP · X-Frame-Options · nosniff</text>
  </g>

  <!-- Column: Data & Media -->
  <g filter="url(#shadow)">
    <rect x="768" y="126" width="344" height="458" rx="16" fill="#1a1a21" stroke="#2a2a33" stroke-width="1.5"/>
  </g>
  <rect x="768" y="126" width="344" height="54" rx="16" fill="#22222b"/>
  <rect x="768" y="164" width="344" height="16" fill="#22222b"/>
  <circle cx="802" cy="153" r="6" fill="#e50914"/>
  <text x="822" y="159" fill="#ffffff" font-size="16" font-weight="700" letter-spacing="1.2">DATA &amp; MEDIA</text>

  <g font-size="15">
    <text x="802" y="231" fill="#e8eaf0" font-weight="700">MongoDB</text>
    <text x="802" y="250" fill="#8b93a1" font-size="12">Kullanıcı · İzleme geçmişi</text>

    <text x="802" y="299" fill="#e8eaf0" font-weight="700">Mongoose 9</text>
    <text x="802" y="318" fill="#8b93a1" font-size="12">Schema · Index · Bağlantı cache</text>

    <text x="802" y="367" fill="#e8eaf0" font-weight="700">TMDB API</text>
    <text x="802" y="386" fill="#8b93a1" font-size="12">Trend · Arama · Detay · Kadro</text>

    <text x="802" y="435" fill="#e8eaf0" font-weight="700">wsrv.nl Image CDN</text>
    <text x="802" y="454" fill="#8b93a1" font-size="12">WebP proxy · Optimizasyon</text>

    <text x="802" y="503" fill="#e8eaf0" font-weight="700">Embed Players</text>
    <text x="802" y="522" fill="#8b93a1" font-size="12">4 sunucu · Reklam koruması</text>
  </g>

  <!-- Footer bar -->
  <rect x="48" y="596" width="1064" height="1" fill="#2a2a33"/>
  <text x="48" y="620" fill="#59616f" font-size="12.5" font-weight="600">Next 16 · React 19 · TS 5 · Tailwind 4 · MongoDB · Mongoose 9 · JWT · bcryptjs · TMDB</text>
  <text x="1112" y="620" fill="#59616f" font-size="12.5" font-weight="600" text-anchor="end">yasinflex</text>
</svg>
